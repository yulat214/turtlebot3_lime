# 1. どのプラグインを使うかを宣言
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# 2. そのプラグイン宛ての設定であることを示す親キー（ここから下はすべてインデントします）
moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

  gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints:
      - gripper_left_joint